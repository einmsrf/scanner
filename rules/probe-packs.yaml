# 漏洞点探测包（仅判活，绝不发送任何 payload）
#
# 结构：<指纹族> → 探测项列表。指纹族与指纹库里的 id/name/product/tags 做
# 规范化后的子串匹配（忽略大小写与 -/_/. 分隔符），命中该族才会跑对应探测项。
#
# 特殊键 `__always__`：不依赖指纹、对所有目标都跑的探测项，只放“价值高且请求极少”的
# 路径（如 Spring Boot Actuator / Swagger），否则会吃掉请求预算。
#
# 每条探测项必须有 matcher：只有返回体（或响应头）里出现该特征串才算命中，
# 裸 200 一律不算命中（DESIGN.md 第 6 节）。matcher 默认按子串匹配，
# 置 regex: true 时按 Go 正则匹配。
#
# severity 用于报告着色：critical/high/medium/low/info

__always__:
- path: /actuator/env
  matcher: propertySources
  name: Spring Boot Actuator 环境变量
  severity: high
- path: /actuator
  matcher: _links
  name: Spring Boot Actuator 索引页
  severity: medium
- path: /actuator/health
  matcher: '"status"'
  name: Spring Boot Actuator 健康检查
  severity: low
- path: /actuator/gateway/routes
  matcher: route_id
  name: Spring Cloud Gateway 路由泄露
  severity: high
- path: /swagger-ui.html
  matcher: swagger
  name: Swagger UI 未授权访问
  severity: medium
- path: /v2/api-docs
  matcher: '"paths"'
  name: Swagger v2 接口文档泄露
  severity: medium
- path: /v3/api-docs
  matcher: openapi
  name: OpenAPI v3 接口文档泄露
  severity: medium

